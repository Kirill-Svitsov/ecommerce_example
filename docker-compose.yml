version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tocco_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5426:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tocco_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6366:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: tocco_backend
    restart: unless-stopped
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8012:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python3 manage.py runserver 0.0.0.0:8000

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: tocco_celery
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    command: celery -A tocco worker --loglevel=info

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: tocco_beat
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    command: celery -A tocco beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
