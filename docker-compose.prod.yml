version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tocco_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tocco_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: tocco_backend
    restart: unless-stopped
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: gunicorn tocco.wsgi:application --bind 0.0.0.0:8000 --workers 4

  nginx:
    image: nginx:1.25-alpine
    container_name: tocco_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: tocco_celery
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      - backend
      - redis
    command: celery -A tocco worker --loglevel=info

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: tocco_beat
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tocco beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
